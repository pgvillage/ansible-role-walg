---
- name: Verify
  hosts: all
  tasks:
    - name: Read the cluster configuration and the cron file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/default/wal-g-molecule, /etc/cron.d/wal-g]
      register: config_files

    - name: Check the cluster configuration and the backup cron job
      ansible.builtin.assert:
        that:
          - "'WALG_S3_PREFIX=s3://backup/molecule' in walg_config"
          - "'PGDATA=/var/lib/pgsql/data' in walg_config"
          - "'WALG_CLUSTER_NAME=molecule' in walg_config"
          - "'WALG_BIN=/usr/bin/wal-g-pg' in walg_config"
          - "'WALG_RETENTION_DAYS=7' in walg_config"
          - "'WALG_ARCHIVE_TIMEOUT=15' in walg_config"
          - "'MAILTO=postgres@' ~ inventory_hostname in cron"
          - "'0 20 * * * postgres /opt/wal-g/scripts/backup_locked.sh molecule' in cron"
        fail_msg: "{{ walg_config + cron }}"
      vars:
        walg_config: "{{ (config_files.results[0].content | b64decode).splitlines() }}"
        cron: "{{ (config_files.results[1].content | b64decode).splitlines() }}"

    # backup_locked.sh (the cron job) takes an etcd lock and runs backup.sh
    - name: Take a backup with the role's backup script, as postgres
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/backup.sh molecule
      changed_when: true

    - name: List the backups with the role's script
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/list-backups.sh molecule
      register: backups
      changed_when: false

    - name: Check that the backup is in the bucket
      ansible.builtin.assert:
        that: backups.stdout_lines | select('match', '^base_') | list | length == 1
        fail_msg: "{{ backups.stdout }}"

    - name: Take a backup again
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/backup.sh molecule
      changed_when: false

    - name: Read the backup log
      ansible.builtin.shell: cat /var/log/wal-g/*_backup.log
      register: backup_log
      changed_when: false

    - name: Check that the second backup was skipped (within WALG_BACKUP_SKIP_WINDOW)
      ansible.builtin.assert:
        that: "'So I am skipping backup on this node.' in backup_log.stdout"
        fail_msg: "{{ backup_log.stdout }}"

    # archive.sh is the archive_command: with the storage down, wal-push retries
    # forever, so archive.sh must give up after WALG_ARCHIVE_TIMEOUT (15 s here)
    - name: Find a WAL file to archive
      ansible.builtin.shell: >-
        set -o pipefail &&
        ls /var/lib/pgsql/data/pg_wal | grep -E '^[0-9A-F]{24}$' | tail -n 1 | sed 's|^|/var/lib/pgsql/data/pg_wal/|'
      register: wal_file
      changed_when: false
      failed_when: wal_file.stdout == ''

    - name: Stop RustFS
      ansible.builtin.systemd:
        name: molecule-rustfs
        state: stopped

    - name: Archive a WAL file with RustFS stopped
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/archive.sh molecule {{ wal_file.stdout }}
      register: archive_down
      failed_when: false
      changed_when: false

    - name: Find wal-push processes left behind
      ansible.builtin.command: pgrep -f 'wal-g-pg wal-push'
      register: wal_push_left
      failed_when: false
      changed_when: false

    - name: Check archive.sh failed on the timeout, within the timeout, and stopped wal-push
      ansible.builtin.assert:
        that:
          - archive_down.rc == 124
          - archive_down.delta is regex('^0:00:(1[5-9]|2[0-9])')
          - wal_push_left.rc == 1
        fail_msg: "rc {{ archive_down.rc }} after {{ archive_down.delta }}, wal-push left: {{ wal_push_left.stdout }}"

    - name: Start RustFS
      ansible.builtin.systemd:
        name: molecule-rustfs
        state: started

    - name: Wait for RustFS
      ansible.builtin.wait_for:
        port: 9000
        timeout: 30

    - name: Archive the same WAL file with RustFS running
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/archive.sh molecule {{ wal_file.stdout }}
      register: archive_up
      retries: 5
      delay: 2
      until: archive_up.rc == 0
      changed_when: true

    # restore.sh: a point in time restore from a chain of two delta backups (wal-g restores the
    # postgresql.auto.conf symlink of every backup in the chain), and a restore of the full backup
    - name: Make two delta backups with data in between, and data after the restore target
      become: true
      become_user: postgres
      ansible.builtin.shell: |
        set -e
        eval "$(sed '/#/d;s/^/export /' /etc/default/wal-g-molecule)"
        psql() { command psql -X -q -At -h /var/run/postgresql -p 5432 -d postgres "$@"; }
        psql -c "CREATE TABLE IF NOT EXISTS restore_test (step text, xid xid8 DEFAULT pg_current_xact_id())"
        psql -c "INSERT INTO restore_test (step) VALUES ('after_full')"
        "$WALG_BIN" backup-push "$PGDATA"
        psql -c "INSERT INTO restore_test (step) VALUES ('after_delta1')"
        "$WALG_BIN" backup-push "$PGDATA"
        psql -c "INSERT INTO restore_test (step) VALUES ('after_delta2')"
        sleep 1
        echo "target=$(psql -c "SELECT to_char(clock_timestamp(), 'YYYY-MM-DD HH24:MI:SS TZH:TZM')")"
        sleep 1
        psql -c "INSERT INTO restore_test (step) VALUES ('too_late')"
        echo "walfile=$(psql -c "SELECT pg_walfile_name(pg_switch_wal())")"
      register: restore_data
      changed_when: true

    - name: Wait until the WAL with the data after the restore target is archived
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -X -At -h /var/run/postgresql -p 5432 -d postgres
        -c "SELECT last_archived_wal >= '{{ restore_data.stdout_lines | select('match', 'walfile=') | first | replace('walfile=', '') }}' FROM pg_stat_archiver"
      register: archived
      until: archived.stdout == 't'
      retries: 30
      delay: 2
      changed_when: false

    - name: Check that the backups are a full backup and two deltas
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/list-backups.sh molecule
      register: backups
      changed_when: false
      failed_when: backups.stdout_lines | select('search', '_D_') | list | length != 2

    - name: Restore to the point in time between after_delta2 and too_late
      become: true
      become_user: postgres
      ansible.builtin.command: /opt/wal-g/scripts/restore.sh molecule /var/lib/pgsql/restore_pitr '{{ restore_target }}'
      vars:
        restore_target: "{{ restore_data.stdout_lines | select('match', 'target=') | first | replace('target=', '') }}"
      register: restore_pitr
      changed_when: true

    - name: Read the data of the restored instance
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -X -At -h /var/run/postgresql -p 15432 -d postgres
        -c "SELECT pg_is_in_recovery(), string_agg(step, ',' ORDER BY xid) FROM restore_test"
      register: restored
      until: restored.stdout is match('^f[|]')
      retries: 30
      delay: 2
      changed_when: false

    - name: Check that the restore replayed the WAL up to the target
      ansible.builtin.assert:
        that: restored.stdout == 'f|after_full,after_delta1,after_delta2'
        fail_msg: "{{ restored.stdout }} {{ restore_pitr.stdout }}"

    - name: Stop the restored instance
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/bin/pg_ctl stop -D /var/lib/pgsql/restore_pitr -m fast
      changed_when: true

    # A transaction id as target: restore.sh restores the oldest backup (the full one) and replays the WAL
    - name: Find the transaction id of after_full
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -X -At -h /var/run/postgresql -p 5432 -d postgres
        -c "SELECT xid FROM restore_test WHERE step = 'after_full'"
      register: after_full_xid
      changed_when: false

    - name: Restore the full backup up to after_full
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        /opt/wal-g/scripts/restore.sh molecule /var/lib/pgsql/restore_full {{ after_full_xid.stdout }}
      register: restore_full
      changed_when: true

    - name: Read the data of the instance restored from the full backup
      become: true
      become_user: postgres
      ansible.builtin.command: >-
        psql -X -At -h /var/run/postgresql -p 15432 -d postgres
        -c "SELECT pg_is_in_recovery(), string_agg(step, ',' ORDER BY xid) FROM restore_test"
      register: restored_full
      until: restored_full.stdout is match('^f[|]')
      retries: 30
      delay: 2
      changed_when: false

    - name: Check the instance restored from the full backup
      ansible.builtin.assert:
        that:
          - "'Fetching backup ' ~ (backups.stdout_lines | select('match', '^base_') | first).split() | first ~ ' ' in restore_full.stdout"
          - restored_full.stdout == 'f|after_full'
        fail_msg: "{{ restored_full.stdout }} {{ restore_full.stdout }}"

    - name: Stop the instance restored from the full backup
      become: true
      become_user: postgres
      ansible.builtin.command: /usr/bin/pg_ctl stop -D /var/lib/pgsql/restore_full -m fast
      changed_when: true
