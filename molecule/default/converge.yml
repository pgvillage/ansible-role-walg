---
- name: Converge
  hosts: all
  vars:
    walg_pg_datadir: /var/lib/pgsql/data
    walg_pg_bindir: /usr/bin
    # The local RustFS from prepare.yml, over http, so there are no
    # certificates to deploy (as in pgvillage, which sets these to {})
    walg_cert_folders: {}
    walg_cert_files: {}
    walg_bucket_defaults:
      AWS_ACCESS_KEY_ID: AWSKEY
      AWS_SECRET_ACCESS_KEY: AWSSECRET
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: true
    walg_clusters:
      molecule:
        pg_datadir: /var/lib/pgsql/data
        pg_port: 5432
        s3_prefix: s3://backup/molecule
  roles:
    - role: pgvillage.walg
